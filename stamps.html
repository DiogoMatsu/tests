<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stamp Calculator</title>

  <style>
    :root {
      --bg: #0e0e11;
      --card: #1f1f26;
      --text: #ffffff;
      --muted: #9aa0a6;
      --accent: #4da3ff;
      --border: #2a2a35;
      --danger: #ff5c5c;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
    }

    button, select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 16px;
    }

    .back-btn {
      margin-bottom: 12px;
      opacity: 0.8;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .display {
      font-size: 22px;
      text-align: right;
      padding: 12px;
      background: #000;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    /*.display span {*/
    /*  display: inline-block;*/
    /*  transition: transform 0.12s ease, opacity 0.12s ease;*/
    /*}*/
    .display span {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 600;
      letter-spacing: 0.04em;

      font-size: clamp(32px, 9vw, 48px);
      line-height: 1.1;

      display: inline-block;
      white-space: nowrap;
    }

    .display span.bump {
      transform: translateY(-2px) scale(1.06);
      opacity: 0.9;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .keypad button {
      padding: 14px;
      font-size: 18px;
    }

    .keypad button {
      transition: transform 0.08s ease, background-color 0.08s ease;
    }

    .keypad button:active {
      transform: scale(0.9);
      background-color: #2f2f3a;
    }


    .wide {
      grid-column: span 3;
    }

    .quick {
      background: #2a2a35;
      font-weight: 600;
    }

    .item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .item span {
      cursor: pointer;
      padding: 8px 0;
    }

    .item button {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 16px;
    }

    .summary {
      font-size: 15px;
      margin-bottom: 8px;
    }

    .highlight {
      color: var(--accent);
      font-weight: 600;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .summary-block {
      flex: 1;
      text-align: center;
    }

    .summary-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
    }

    .summary-label {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }


    .menu {
      display: flex;
      gap: 8px;
    }

    .progress-wrapper {
      position: relative;
      margin: 8px 0 12px;
    }

    .progress {
      width: 100%;
      height: 8px;
      background: #000;
      border-radius: 6px;
      overflow: hidden; /* keep bar clipped */
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.25s ease;
    }

    .stamp-badge {
      position: absolute;
      right: 12px;
      top: -22px; /* float above bar */
      background: var(--accent);
      color: #000;
      font-size: 14px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 999px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }

    .stamp-badge.show {
      opacity: 1;
      transform: translateY(0);
    }

    select {
      width: 100%;
    }

    input {
      background: #000;
      color: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 16px;
      width: 100%;
    }

    @keyframes reject {
      0%   { transform: translateX(0); color: inherit; }
      25%  { transform: translateX(-3px); color: #ff5a5a; }
      50%  { transform: translateX(3px); color: #ff5a5a;}
      75%  { transform: translateX(-2px); color: #ff5a5a;}
      100% { transform: translateX(0); color: inherit; }
    }

    .display span.reject {
      animation: reject 0.18s ease;
    }



  </style>
</head>

<body>
<div class="container">

  <div class="card">
    <div class="menu">
      <select id="menuSelect" onchange="handleMenu(this.value)">
        <option value="">Options</option>
        <option value="25">R$25 per stamp</option>
        <option value="30">R$30 per stamp</option >
        <option value="custom">Set Custom stamp</option>
        <option value="clear">Clear all items</option>
      </select>
    </div>
  </div>
  <div class="card">
    <div class="summary" id="summary"></div>
    <div class="progress-wrapper">
      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="stamp-badge" id="stampBadge"></div>
    </div>
  </div>


<!--  <button class="back-btn" onclick="location.href='index.html'">← Back</button>-->
<!--  <h1>Stamp Calculator</h1>-->

  <div class="card">
    <div class="display">
      <span id="displayText">0</span>
    </div>


    <div class="keypad">

      <button onclick="addDigit('7')">7</button>
      <button onclick="addDigit('8')">8</button>
      <button onclick="addDigit('9')">9</button>

      <button onclick="addDigit('4')">4</button>
      <button onclick="addDigit('5')">5</button>
      <button onclick="addDigit('6')">6</button>

      <button onclick="addDigit('1')">1</button>
      <button onclick="addDigit('2')">2</button>
      <button onclick="addDigit('3')">3</button>

      <button onclick="addDigit('.')">.</button>
      <button onclick="addDigit('0')">0</button>
      <button onclick="backspace()">⌫</button>

      <button class="quick" onclick="quickAdd('.98')">.98</button>
      <button class="quick" onclick="quickAdd('.89')">.89</button>
      <button class="quick" onclick="addItem()">↵</button>

<!--      <button class="wide" onclick="clearInput()">Clear</button>-->
    </div>
  </div>

  <div class="card">
    <strong>By Weight</strong>

    <div style="display:flex; gap:8px; margin-top:8px;">
      <input
              id="weight"
              type="number"
              inputmode="decimal"
              placeholder="g"
              step="0.001"
              oninput="updateWeightPreview()"
              style="flex:1;"
      />
      <input
              id="pricePerKg"
              type="number"
              inputmode="decimal"
              placeholder="R$/kg"
              step="0.01"
              oninput="updateWeightPreview()"
              style="flex:1;"
      />
      <button onclick="addByWeight()">Add</button>
    </div>

    <div id="weightPreview" style="margin-top:6px; font-size:14px; color:var(--muted);">
      &nbsp;
    </div>
  </div>



  <div class="card">
    <div id="items"></div>
  </div>


</div>

<script>
  const STORAGE_ITEMS = "stamp_items";
  const STORAGE_THRESHOLD = "stamp_threshold";

  let input = "";
  let items = JSON.parse(localStorage.getItem(STORAGE_ITEMS) || "[]");
  let threshold = parseFloat(localStorage.getItem(STORAGE_THRESHOLD)) || 25;
  // let lastProgress = 0;
  let lastStampCount = null;

  const display = document.getElementById("displayText");
  const itemsDiv = document.getElementById("items");
  const summaryDiv = document.getElementById("summary");
  const menuSelect = document.getElementById("menuSelect");

  function save() {
    localStorage.setItem(STORAGE_ITEMS, JSON.stringify(items));
    localStorage.setItem(STORAGE_THRESHOLD, threshold);
  }

  function updateDisplay() {
    const text = input || "0";
    const span = document.getElementById("displayText");

    span.textContent = text;

    span.classList.remove("bump");
    void span.offsetWidth; // force reflow
    span.classList.add("bump");

    setTimeout(() => {
      span.classList.remove("bump");
    }, 120);
  }

  function toCurrency(value) {
    return "R$" + value.toFixed(2);
  }

  /**
   * Validate a new digit before adding.
   * Returns true if valid, false if invalid.
   * @param d
   */
  function isValidNewDigit(d)
  {
    // Only allow digits or "."
    if (!/^[0-9.]$/.test(d)) return false;

    // Prevent multiple dots
    if (d === "." && input.includes(".")) return false;

    let next = input + d;

    // Split integer / decimal parts
    const [intPart, decPart = ""] = next.split(".");

    // Limit integer part to 3 digits (max 999)
    if (intPart.length > 3) return false;
    if (Number(intPart) > 999) return false;

    // Limit decimal part to 2 digits
    if (decPart.length > 2) return false;
    return true;
  }

  function addDigit(d) {
    if (input === "" && d === ".") {
      input = "0.";
      updateDisplay();
      return;
    }

    if (isValidNewDigit(d)) {
      input += d;
      updateDisplay();
    }
    else {
      rejectInput();
    }
  }

  function rejectInput() {
    const span = document.getElementById("displayText");

    span.classList.remove("reject");
    void span.offsetWidth; // reflow
    span.classList.add("reject");

    if (navigator.vibrate) navigator.vibrate(8);
  }



  function backspace() {
    input = input.slice(0, -1);
    updateDisplay();
  }

  function clearInput() {
    input = "";
    updateDisplay();
  }

  function quickAdd(suffix) {
    if (!input) return;
    const value = parseFloat(input + suffix);
    if (!isNaN(value)) {
      addItem(value);
    }
  }


  function getCurrentWeightItem() {
    let w = parseFloat(document.getElementById("weight").value);
    const p = parseFloat(document.getElementById("pricePerKg").value);
    if (isNaN(w) || isNaN(p) || w <= 0 || p <= 0) return null;

    w /= 1000; // convert to grams
    return w * p;
  }
  function updateWeightPreview() {
    const total = getCurrentWeightItem();
    const preview = document.getElementById("weightPreview");
    if (total == null) {
      preview.innerHTML = "&nbsp;";
      return;
    }
    preview.textContent = `≈ ${toCurrency(total)}`;
  }

  function addByWeight() {
    const total = getCurrentWeightItem();
    if (total == null) return;

    addItem(Number(total.toFixed(2)));

    document.getElementById("weight").value = "";
    document.getElementById("pricePerKg").value = "";
    document.getElementById("weightPreview").innerHTML = "&nbsp;";
  }


  function addItem(value) {
    if (value === undefined) {
      if (!input) return;
      value = parseFloat(input)
    }

    items.push(value);
    input = "";
    updateDisplay();
    save();
    render();
  }

  function handleMenu(value) {
    if (!value) return;

    if (value === "clear") {
      if (confirm("Delete all items?")) {
        items = [];
        save();
        lastStampCount = null;
        render();
      }
    }
    else if (value === "custom") {
      const newValue = prompt("Edit price:", threshold.toFixed(2));
      threshold = parseFloat(newValue);
      save();
      render();
    }
    else {
      threshold = parseFloat(value);
      save();
      render();
    }

    menuSelect.value = "";
  }


  function setProgress(newProgress, overflowAmount = 0) {
    const bar = document.getElementById("progressBar");
    if (!bar) return;

    newProgress = Math.max(0, Math.min(100, newProgress));

    const FAST = 500;   // fast loops
    const NORMAL = 800; // final loop

    if (overflowAmount === undefined || overflowAmount === 0)
    {
      bar.style.transition = `width ${NORMAL}ms ease`;
      bar.style.width = `${newProgress}%`;
      return;
    }

    var endProgress;
    var startProgress;
    var cycles;
    if (overflowAmount > 0)
    {
      endProgress = "100%";
      startProgress = "0%";
      cycles = overflowAmount;
    }
    else
    {
      endProgress = "0%";
      startProgress = "100%";
      cycles = -overflowAmount;
    }


    // first fill to end
    bar.style.transition = `width ${FAST}ms ease`;
    bar.style.width = endProgress;

    // schedules fills
    for (var i = 1; i < cycles; i++)
    {
      setTimeout(() => {
        // haptic:
        hapticTick();

        // Snap to begin
        bar.style.transition = "none";
        bar.style.width = startProgress;
        bar.offsetHeight;

        // animate to end:
        bar.style.transition = `width ${FAST}ms ease`;
        bar.style.width = endProgress;
      }, FAST * i);
    }

    // Final fill to remainder
    setTimeout(() => {
      bar.style.transition = "none";
      bar.style.width = startProgress;
      bar.offsetHeight;

      bar.style.transition = `width ${NORMAL}ms ease`;
      bar.style.width = `${newProgress}%`;
    }, FAST * cycles);

    // show stamp count:
    showStampBadge(overflowAmount);
  }

  function showStampBadge(count) {
    const badge = document.getElementById("stampBadge");
    if (!badge || count === 0) return;

    if (count > 0) {
      badge.textContent = `+${count}`;
    }
    else {
      badge.textContent = `${count}`;
    }
    badge.classList.add("show");

    setTimeout(() => {
      badge.classList.remove("show");
    }, 800);
  }

  function hapticTick() {
    navigator.vibrate?.(8);
  }


  function render() {
    itemsDiv.innerHTML = "";

    let total = items.reduce((a, b) => a + b, 0);
    const stamps = total > 0 ? Math.floor(total / threshold) : 0;
    let remainder = total % threshold;

    const toNext = remainder === 0 ? threshold : threshold - remainder;

    summaryDiv.innerHTML = `
  <div class="summary-row">
    <div class="summary-block">
      <div class="summary-value">${toCurrency(total)}</div>
      <div class="summary-label">Total</div>
    </div>

    <div class="summary-block">
      <div class="summary-value">${stamps}</div>
      <div class="summary-label">Stamps</div>
    </div>

    <div class="summary-block">
      <div class="summary-value">
        ${toNext === 0 ? "✓" : `${toCurrency(toNext)}`}
      </div>
      <div class="summary-label">
        ${toNext === 0 ? "Complete" : "To next"}
      </div>
    </div>
  </div>
`;


    items.forEach((price, i) => {
      const row = document.createElement("div");
      row.className = "item";

      const label = document.createElement("span");
      label.textContent = toCurrency(price);
      label.onclick = () => {
        const v = prompt("Edit price:", price.toFixed(2));
        if (v !== null) {
          const n = parseFloat(v);
          if (!isNaN(n)) {
            items[i] = n;
            save();
            render();
          }
        }
      };

      const del = document.createElement("button");
      del.textContent = "✕";
      del.onclick = () => {
        items.splice(i, 1);
        save();
        render();
      };

      row.appendChild(label);
      row.appendChild(del);
      itemsDiv.appendChild(row);
    });

    // progress bar:
    let progress = (threshold - toNext) / threshold * 100;
    if (lastStampCount == null) {
      setProgress(progress);
    }
    else {
      setProgress(progress, stamps - lastStampCount);
    }
    lastStampCount = stamps;
  }

  updateDisplay();
  render();
</script>

</body>
</html>
