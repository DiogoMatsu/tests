<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Spending</title>

<style>
body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding-bottom: 70px; /* room for the fixed Advanced Options bar */
    background: white;
}

header {
    background: #333;
    color: white;
    padding: 12px;
    font-size: 20px;
    text-align: center;
}

.container {
    padding: 10px;
}

input, select, textarea, button {
    font-size: 16px;
    padding: 8px;
    margin: 4px 0;
    width: 100%;
    box-sizing: border-box;
}

textarea {
    resize: none;
    height: 40px;
}

button {
    background: #007aff;
    color: white;
    border: none;
    border-radius: 6px;
}

button:disabled {
    background: #b0cff5;
}

.advanced {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 6px 10px;
    background: white;
    border-top: 1px solid #ddd;
}

.entry {
    border-bottom: 1px solid #ddd;
    padding: 4px 0;
}

.entry-row {
    display: flex;
    gap: 4px;
}

.entry input, .entry select, .entry button {
    padding: 6px 4px;
    margin: 2px 0;
}

/* type takes the remaining space; the other columns stay fixed */
.entry-type { flex: 1; min-width: 0; }
.entry-value { flex: none; width: 100px; }
.entry .delete-btn { flex: none; width: 40px; }

/* formatted value; tap to edit */
.entry .entry-value {
    background: #eef4ff;
    color: #007aff;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.day-total {
    font-weight: bold;
    padding: 6px 0 10px;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

.modal.hidden {
    display: none;
}

.modal-box {
    background: white;
    padding: 12px;
    border-radius: 10px;
    width: 80%;
}

.modal-buttons {
    display: flex;
    gap: 6px;
}

.cancel-btn {
    background: #8e8e93;
}

.total {
    font-weight: bold;
}

.hidden {
    display: none;
}

/* "Hide currency" option for single-currency trips */
.no-currency #currencySelect,
.no-currency #valueModalCurrency {
    display: none;
}

/* indent fold-out contents under their heading */
details {
    padding-left: 20px;
}

details > summary {
    margin-left: -20px;
}

.advanced summary {
    font-size: 16px;
    font-weight: bold;
    padding: 8px 0;
}

.toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    padding: 8px 0;
}

.toggle input {
    width: auto;
    margin: 0;
    transform: scale(1.4);
}

.delete-btn {
    background: #ff3b30;
    font-weight: bold;
}

.extra-fields {
    display: flex;
    gap: 6px;
}

</style>
</head>

<body>

<header id="title" contenteditable="true"></header>

<div class="container">

<select id="typeSelect"></select>

<div id="extraFields" class="extra-fields"></div>

<div style="display:flex; gap:6px;">
<input id="valueInput" type="text" inputmode="decimal" placeholder="Value">
<select id="currencySelect"></select>
</div>

<textarea id="notesInput" placeholder="Notes (optional)"></textarea>

<button id="addButton" onclick="addEntry()" disabled>Add Entry</button>

<hr>

<div class="history" id="history"></div>

</div>

<div id="valueModal" class="modal hidden" onclick="if(event.target===this) closeValueEditor()">
<div class="modal-box">
<div id="valueModalLabel"></div>
<div style="display:flex; gap:6px;">
<input id="valueModalInput" type="text" inputmode="decimal">
<select id="valueModalCurrency"></select>
</div>
<div class="modal-buttons">
<button class="cancel-btn" onclick="closeValueEditor()">Cancel</button>
<button onclick="saveValueEditor()">Save</button>
</div>
</div>
</div>

<div id="currencyModal" class="modal hidden" onclick="if(event.target===this) closeCurrencyConfig()">
<div class="modal-box">
<div><b>Visible Currencies</b></div>
<div id="currencyModalList"></div>
<button onclick="closeCurrencyConfig()">Done</button>
</div>
</div>

<div class="advanced">

<details id="advancedDetails">
<summary>Advanced Options</summary>

<label class="toggle">
<input id="hideCurrencyToggle" type="checkbox">
Hide currency
</label>

<button onclick="openCurrencyConfig()">Visible Currencies</button>
<button onclick="exportCSV()">Export to Sheets (CSV)</button>
<button onclick="copyJSON()">Export to Clipboard</button>
<button onclick="importJSON()">Import from Clipboard</button>
<button onclick="clearAll()">Clear All Data</button>

</details>

</div>

<script>

/* ========= CONFIG ========= */

function formatDays(days) {
    return days+(Number(days)===1 ? " day" : " days");
}

/* fields: extra inputs shown for the type; their values are joined with " - " into notes */
const TYPES = [
    {name:"Transport", color:"#ffd166", fields:[{id:"from", label:"From"}, {id:"to", label:"To"}]},
    {name:"Breakfast", color:"#f78c6b"},
    {name:"Lunch", color:"#ef476f"},
    {name:"Coffee Break", color:"#a0522d"},
    {name:"Dinner", color:"#c9184a"},
    {name:"Shopping", color:"#83c5be"},
    {name:"Gift", color:"#06d6a0"},
    {name:"Hotel", color:"#118ab2", fields:[{id:"name", label:"Name"}, {id:"days", label:"Days", inputmode:"numeric", format:formatDays}]},
    {name:"Flight", color:"#9b5de5", fields:[{id:"from", label:"From"}, {id:"to", label:"To"}]},
    {name:"Other", color:"#adb5bd"}
];

/* old type names mapped to their replacements */
const RENAMED_TYPES = {Uber:"Transport"};

const CURRENCIES = [
    {code:"brl", label:"🇧🇷 Real", locale:"pt-BR"},
    {code:"usd", label:"🇺🇸 Dollar", locale:"en-US"},
    {code:"eur", label:"🇪🇺 Euro", locale:"de-DE"},
    {code:"jpy", label:"🇯🇵 Yen", locale:"ja-JP"},
    {code:"pyg", label:"🇵🇾 Guarani", locale:"es-PY"},
    {code:"other", label:"🌐 Other", locale:"en-US"}
];


/* ========= STORAGE ========= */

function loadData() {
    const data=JSON.parse(localStorage.getItem("spendings") || "[]");

    data.forEach(e=>{
        if(RENAMED_TYPES[e.type]) e.type=RENAMED_TYPES[e.type];
    });

    return data;
}

/* accepts "12,50" as well as "12.50" */
function parseValue(text) {
    return Number(String(text).replace(",", "."));
}

function saveData(data) {
    localStorage.setItem("spendings", JSON.stringify(data));
}

/* unsaved form input, kept across reloads */
function loadDraft() {
    return JSON.parse(localStorage.getItem("draft") || "{}");
}

function saveDraft() {

    const draft={
        type: document.getElementById("typeSelect").value,
        value: document.getElementById("valueInput").value,
        notes: document.getElementById("notesInput").value,
        /* keyed by field id, so From/To carry over between Transport and Flight */
        extra: loadDraft().extra || {}
    };

    document.querySelectorAll("#extraFields input").forEach(input=>{
        draft.extra[input.dataset.field]=input.value;
    });

    localStorage.setItem("draft", JSON.stringify(draft));
}

/* fold-out open/closed state, kept across reloads and re-renders */
function rememberFold(details, key, defaultOpen) {

    const folds=JSON.parse(localStorage.getItem("folds") || "{}");

    details.open=key in folds ? folds[key] : defaultOpen;

    details.addEventListener("toggle", ()=>{
        const folds=JSON.parse(localStorage.getItem("folds") || "{}");
        folds[key]=details.open;
        localStorage.setItem("folds", JSON.stringify(folds));
    });
}

/* ========= TITLE ========= */

function initTitle() {

    const title = document.getElementById("title");

    title.textContent = localStorage.getItem("title") || "Travel Spending";

    title.addEventListener("blur", () => {
        localStorage.setItem("title", title.textContent);
    });
}

/* ========= INIT ========= */

function init() {

    initTitle();

    rememberFold(document.getElementById("advancedDetails"), "advanced", false);

    const typeSelect = document.getElementById("typeSelect");

    TYPES.forEach(t=>{
        const o=document.createElement("option");
        o.text=t.name;
        o.value=t.name;
        o.style.background=t.color;
        typeSelect.appendChild(o);
    });

    const draft=loadDraft();

    if(getType(draft.type)) typeSelect.value=draft.type;
    document.getElementById("valueInput").value=draft.value || "";
    document.getElementById("notesInput").value=draft.notes || "";

    typeSelect.addEventListener("change", ()=>{
        renderExtraFields();
        saveDraft();
    });
    renderExtraFields();

    ["valueInput","notesInput","extraFields"].forEach(id=>
        document.getElementById(id).addEventListener("input", saveDraft));

    document.getElementById("valueInput").addEventListener("input", updateAddButton);
    updateAddButton();

    const currencySelect=document.getElementById("currencySelect");

    fillCurrencySelect(currencySelect, localStorage.getItem("lastCurrency"));

    currencySelect.addEventListener("change", ()=>{
        localStorage.setItem("lastCurrency", currencySelect.value);
    });

    const hideCurrencyToggle=document.getElementById("hideCurrencyToggle");

    hideCurrencyToggle.checked=localStorage.getItem("hideCurrency")==="true";
    document.body.classList.toggle("no-currency", hideCurrencyToggle.checked);

    hideCurrencyToggle.addEventListener("change", ()=>{
        localStorage.setItem("hideCurrency", hideCurrencyToggle.checked);
        document.body.classList.toggle("no-currency", hideCurrencyToggle.checked);
    });

    document.getElementById("valueModalInput").addEventListener("keydown", ev=>{
        if(ev.key==="Enter") saveValueEditor();
    });

    renderHistory();
}

/* ========= VISIBLE CURRENCIES ========= */

function getVisibleCurrencies() {
    const codes=JSON.parse(localStorage.getItem("visibleCurrencies") || "null");
    return codes ? CURRENCIES.filter(c=>codes.includes(c.code)) : CURRENCIES;
}

/* fills a dropdown with the visible currencies; keepSelected adds `selected` even when hidden */
function fillCurrencySelect(select, selected, keepSelected) {

    select.innerHTML="";

    const list=getVisibleCurrencies().slice();

    if(keepSelected && !list.some(c=>c.code===selected)) {
        list.unshift(CURRENCIES.find(c=>c.code===selected));
    }

    list.forEach(c=>{
        const o=document.createElement("option");
        o.text=c.label;
        o.value=c.code;
        select.appendChild(o);
    });

    if(list.some(c=>c.code===selected)) select.value=selected;
}

function openCurrencyConfig() {

    const listEl=document.getElementById("currencyModalList");
    listEl.innerHTML="";

    const visible=getVisibleCurrencies().map(c=>c.code);

    CURRENCIES.forEach(c=>{

        const label=document.createElement("label");
        label.className="toggle";

        const box=document.createElement("input");
        box.type="checkbox";
        box.value=c.code;
        box.checked=visible.includes(c.code);

        box.onchange=()=>{

            const checked=[...listEl.querySelectorAll("input:checked")].map(b=>b.value);

            /* at least one currency must stay visible */
            if(!checked.length) {
                box.checked=true;
                return;
            }

            localStorage.setItem("visibleCurrencies", JSON.stringify(checked));

            const currencySelect=document.getElementById("currencySelect");
            fillCurrencySelect(currencySelect, currencySelect.value);
            localStorage.setItem("lastCurrency", currencySelect.value);
        };

        label.appendChild(box);
        label.appendChild(document.createTextNode(c.label));

        listEl.appendChild(label);
    });

    document.getElementById("currencyModal").classList.remove("hidden");
}

function closeCurrencyConfig() {
    document.getElementById("currencyModal").classList.add("hidden");
}

/* ========= EXTRA FIELDS ========= */

function getType(name) {
    return TYPES.find(t=>t.name===name);
}

function renderExtraFields() {

    const container=document.getElementById("extraFields");
    container.innerHTML="";

    const type=getType(document.getElementById("typeSelect").value);

    const extra=loadDraft().extra || {};

    (type.fields || []).forEach(f=>{
        const input=document.createElement("input");
        input.id="extra-"+f.id;
        input.dataset.field=f.id;
        input.value=extra[f.id] || "";
        input.placeholder=f.label;
        if(f.inputmode) input.inputMode=f.inputmode;
        container.appendChild(input);
    });

    /* types with their own fields don't need free notes */
    document.getElementById("notesInput")
        .classList.toggle("hidden", !!type.fields);
}

/* builds "{field1} - {field2}" from the extra fields, followed by any free notes */
function buildNotes(typeName, notes) {

    const type=getType(typeName);

    const parts=(type.fields || []).map(f=>{
        const v=document.getElementById("extra-"+f.id).value.trim();
        return v && f.format ? f.format(v) : v;
    });

    if(type.fields) return parts.some(p=>p) ? parts.join(" - ") : "";

    return notes.trim();
}

/* ========= FORMAT ========= */

function formatCurrency(value, currencyCode) {

    const c = CURRENCIES.find(x=>x.code===currencyCode);

    /* "other" is not a real ISO currency code, so show a plain number */
    if(currencyCode==="other") {
        return new Intl.NumberFormat(c.locale, {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format(value);
    }

    return new Intl.NumberFormat(c.locale, {
        style: "currency",
        currency: currencyCode.toUpperCase()
    }).format(value);

}

/* ========= DATE ========= */

/* "2026-10-30" -> "October 30" */
function formatDay(day) {
    return new Date(day+"T00:00").toLocaleDateString("en-US", {
        month: "long",
        day: "numeric"
    });
}

function getLocalDateTime() {

    const d=new Date();

    /* toISOString is UTC, which jumps to the next day in the evening for negative offsets */
    const pad=n=>String(n).padStart(2,"0");

    return {
        day: `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`
    };
}

/* ========= ADD ========= */

function isValidValue(text) {
    return text.trim()!=="" && !isNaN(parseValue(text));
}

function updateAddButton() {
    document.getElementById("addButton").disabled=
        !isValidValue(document.getElementById("valueInput").value);
}

function addEntry() {

    const type=document.getElementById("typeSelect").value;
    const value=document.getElementById("valueInput").value;
    const currency=document.getElementById("currencySelect").value;
    const notes=buildNotes(type, document.getElementById("notesInput").value);

    if(!isValidValue(value)) return;

    const {day}=getLocalDateTime();

    const data=loadData();

    data.push({
        type,
        value:parseValue(value),
        currency,
        notes,
        day
    });

    saveData(data);

    document.getElementById("valueInput").value="";
    document.getElementById("notesInput").value="";
    localStorage.setItem("draft", JSON.stringify({type}));
    renderExtraFields();
    updateAddButton();

    renderHistory();
}

/* ========= DELETE ========= */

function deleteEntry(index) {

    const data=loadData();

    if(confirm("Delete this entry?")) {

        data.splice(index,1);

        saveData(data);

        renderHistory();
    }
}

/* ========= INLINE EDIT ========= */

function updateEntry(index, field, value) {

    const data=loadData();

    if(field==="value") {
        if(isNaN(parseValue(value))) return renderHistory();
        data[index][field]=parseValue(value);
    } else {
        data[index][field]=value;
    }

    saveData(data);

    renderHistory();
}

/* saves without re-rendering, so the field keeps focus while typing */
function saveField(index, field, value) {

    const data=loadData();

    data[index][field]=value;

    saveData(data);
}

/* ========= VALUE EDITOR ========= */

let editingIndex=null;

function openValueEditor(index) {

    const e=loadData()[index];

    editingIndex=index;

    document.getElementById("valueModalLabel").textContent=e.type;

    const input=document.getElementById("valueModalInput");
    input.value=e.value;

    /* keep the entry's own currency selectable even if it is hidden */
    fillCurrencySelect(document.getElementById("valueModalCurrency"), e.currency, true);

    document.getElementById("valueModal").classList.remove("hidden");

    /* must happen inside the tap for iOS to open the keyboard */
    input.focus();
    input.select();
}

function closeValueEditor() {
    editingIndex=null;
    document.getElementById("valueModal").classList.add("hidden");
}

function saveValueEditor() {

    const value=parseValue(document.getElementById("valueModalInput").value);

    if(!isNaN(value)) {

        const data=loadData();

        data[editingIndex].value=value;
        data[editingIndex].currency=document.getElementById("valueModalCurrency").value;

        saveData(data);

        renderHistory();
    }

    closeValueEditor();
}

/* ========= RENDER ========= */

function renderHistory() {

    const history=document.getElementById("history");
    history.innerHTML="";

    const data=loadData();

    const days={};

    data.forEach((e,i)=>{
        if(!days[e.day]) days[e.day]=[];
        days[e.day].push({entry:e,index:i});
    });

    Object.keys(days).sort().forEach(day=>{

        const details=document.createElement("details");
        rememberFold(details, "day-"+day, true);

        const summary=document.createElement("summary");
        summary.textContent=formatDay(day);

        details.appendChild(summary);

        const totals={};

        days[day].forEach(obj=>{

            const e=obj.entry;

            if(!totals[e.currency]) totals[e.currency]=0;
            totals[e.currency]+=e.value;

            const entry=document.createElement("div");
            entry.className="entry";

            const row=document.createElement("div");
            row.className="entry-row";

            /* TYPE */
            const typeSelect=document.createElement("select");
            typeSelect.className="entry-type";

            /* keep legacy types (e.g. "Meal") visible on old entries */
            const typeNames=TYPES.map(t=>t.name);
            if(!typeNames.includes(e.type)) typeNames.unshift(e.type);

            typeNames.forEach(name=>{
                const o=document.createElement("option");
                o.value=name;
                o.text=name;
                if(name===e.type) o.selected=true;
                typeSelect.appendChild(o);
            });

            typeSelect.onchange=(ev)=>
                updateEntry(obj.index,"type",ev.target.value);

            /* VALUE */
            const valueBtn=document.createElement("button");
            valueBtn.className="entry-value";
            valueBtn.textContent=formatCurrency(e.value,e.currency);

            valueBtn.onclick=()=>openValueEditor(obj.index);

            /* DELETE */
            const delBtn=document.createElement("button");
            delBtn.textContent="✕";
            delBtn.className="delete-btn";
            delBtn.setAttribute("aria-label","Delete");

            delBtn.onclick=()=>deleteEntry(obj.index);

            /* NOTES */
            const notesInput=document.createElement("input");
            notesInput.value=e.notes;
            notesInput.placeholder="Notes";

            notesInput.oninput=(ev)=>
                saveField(obj.index,"notes",ev.target.value);

            notesInput.onchange=(ev)=>
                updateEntry(obj.index,"notes",ev.target.value);

            row.appendChild(typeSelect);
            row.appendChild(valueBtn);
            row.appendChild(delBtn);

            /* notes go on their own line so the main row has room */
            entry.appendChild(row);
            entry.appendChild(notesInput);

            details.appendChild(entry);

        });

        /* DAY TOTAL */

        const dayTotal=document.createElement("div");
        dayTotal.className="day-total";

        let txt="Total: ";

        Object.keys(totals).forEach(c=>{
            txt+=formatCurrency(totals[c],c)+"  ";
        });

        dayTotal.textContent=txt;

        details.appendChild(dayTotal);


        history.appendChild(details);

    });

    renderTotals(data);
}

/* ========= GLOBAL TOTAL ========= */

function renderTotals(data) {

    const history=document.getElementById("history");

    const details=document.createElement("details");
    rememberFold(details, "total", false);

    const summary=document.createElement("summary");
    summary.textContent="Total Spent";

    details.appendChild(summary);

    const totals={};

    data.forEach(e=>{
        if(!totals[e.currency]) totals[e.currency]=0;
        totals[e.currency]+=e.value;
    });

    Object.keys(totals).forEach(c=>{

        const div=document.createElement("div");
        div.className="total";
        div.textContent=formatCurrency(totals[c],c);

        details.appendChild(div);

    });

    history.appendChild(details);
}

/* ========= CSV ========= */

function exportCSV() {

    const data=loadData();

    let csv="type\tvalue\tcurrency\tnotes\n";

    data.forEach(e=>{
        csv+=`${e.type}\t${e.value}\t${e.currency}\t${e.notes}\n`;
    });

    navigator.clipboard.writeText(csv);

    alert("CSV copied to clipboard.");
}

/* ========= JSON ========= */

function copyJSON() {

    navigator.clipboard.writeText(
        JSON.stringify(loadData())
    );

    alert("JSON copied.");
}

async function importJSON() {

    const text=await navigator.clipboard.readText();

    saveData(JSON.parse(text));

    renderHistory();

}

/* ========= CLEAR ========= */

function clearAll() {

    if(confirm("Clear all data?")) {

        localStorage.removeItem("spendings");

        renderHistory();
    }
}

/* ========= START ========= */

init();

</script>

</body>
</html>
